# Render Blueprint — provisions the backend, a Postgres DB, and Redis in one go.
# In Render: New + → Blueprint → connect this repo. Everything below is created
# automatically and redeploys whenever you push to the connected branch.
#
# Free tier notes:
#   - The web service sleeps after ~15 min idle and cold-starts on the next
#     request (~50s). The background worker sleeps with it.
#   - Disk is ephemeral: job *records* live in Postgres and persist, but uploaded
#     and generated *files* are wiped on redeploy/restart (use S3 for permanence).

databases:
  - name: jobplatform-db
    plan: free
    databaseName: jobplatform
    user: jobplatform

services:
  # Redis — Celery broker + result backend.
  - type: redis
    name: jobplatform-redis
    plan: free
    ipAllowList: []          # only reachable from other Render services

  # API + Celery worker in one container (see backend/start.sh).
  - type: web
    name: jobplatform-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: jobplatform-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: jobplatform-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: jobplatform-redis
          property: connectionString
      - key: STORAGE_DIR
        value: /tmp/storage
      # Set this to your deployed frontend URL (JSON array), e.g.
      #   ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
